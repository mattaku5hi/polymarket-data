[package]
name = "polymarket-data"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
description = "Bounded read-only Polymarket public data client (initial Data API trades slice)"

[dependencies]
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-stream = "0.1"
